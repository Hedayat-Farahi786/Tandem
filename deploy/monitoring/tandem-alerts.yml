# Prometheus alert rules for Tandem's web app (docs/DEPLOYMENT.md, section 10).
#
# Prometheus scrapes every replica's /metrics with the bearer token TANDEM_METRICS_TOKEN, as the
# job "tandem" (see the scrape example at the end). Rules marked "Kubernetes" also need
# kube-state-metrics and the kubelet's cAdvisor metrics, which most Kubernetes Prometheus setups have.
# Check the file with: promtool check rules deploy/monitoring/tandem-alerts.yml
groups:
  - name: tandem
    rules:
      - alert: TandemReplicaDown
        expr: up{job="tandem"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Tandem replica {{ $labels.instance }} does not answer /metrics"
          description: "Its workspaces answer 'restarting' until it is back; the other replicas keep working."

      - alert: TandemReplicaNotInDirectory
        # A replica answers, but has not written its heartbeat to the shared directory (Postgres) for 45 seconds.
        expr: max(tandem_replicas_live) < count(up{job="tandem"} == 1)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} replicas are live in the directory, fewer than are running"
          description: "Check the database connection (TANDEM_DATABASE_URL) and /readyz of each replica."

      - alert: TandemServerErrors
        expr: |
          sum(rate(tandem_http_requests_total{job="tandem",status=~"5.."}[5m]))
            / sum(rate(tandem_http_requests_total{job="tandem"}[5m])) > 0.02
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $value | humanizePercentage }} of Tandem's answers are server errors"
          description: "The JSON logs on stdout name the failing route and error."

      - alert: TandemTasksFailing
        # Tasks that ended FAILED in the last hour, across the cloud workspaces.
        expr: sum(tandem_tasks{job="tandem",state="FAILED"}) - sum(tandem_tasks{job="tandem",state="FAILED"} offset 1h) > 5
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} tasks failed in the last hour"
          description: "One workspace's repositories can fail often; many workspaces failing at once points to Copilot, GitHub or the sandbox."

      - alert: TandemRateLimited
        expr: sum by (policy) (rate(tandem_rate_limited_total{job="tandem"}[10m])) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Tandem refuses more than one request a second by its {{ $labels.policy }} limit"
          description: "Someone is hammering sign-in, the API or the runner endpoint; or a limit is too tight for real use."

      - alert: TandemWebhooksRejected
        # Webhooks with a bad signature: a wrong TANDEM_GITHUB_WEBHOOK_SECRET, or someone guessing.
        expr: sum(rate(tandem_http_requests_total{job="tandem",route="/hooks/github",status="401"}[15m])) > 0.05
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "GitHub webhooks are refused for a bad signature"
          description: "Compare the GitHub App's webhook secret with TANDEM_GITHUB_WEBHOOK_SECRET."

      - alert: TandemMemoryHigh
        # Kubernetes: the container's working set near its memory limit.
        expr: |
          max by (pod) (container_memory_working_set_bytes{container="tandem"})
            / max by (pod) (container_spec_memory_limit_bytes{container="tandem"} > 0) > 0.9
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.pod }} uses {{ $value | humanizePercentage }} of its memory limit"
          description: "Builds run inside the container; lower TANDEM_MAX_CONCURRENT_BUILDS or raise the limit."

      - alert: TandemNotReady
        # Kubernetes: a pod failing /readyz (its database) for five minutes.
        expr: max by (pod) (kube_pod_status_ready{condition="false",pod=~"tandem-[0-9]+"}) == 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.pod }} is not ready"
          description: "/readyz fails when the directory's database does not answer."

      - alert: TandemDiskFilling
        # Kubernetes: a replica's /data volume (repositories, task folders, databases).
        expr: |
          kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"data-tandem-[0-9]+"}
            / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"data-tandem-[0-9]+"} < 0.15
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free"
          description: "Grow the volume before it fills: clones, builds and the workspace databases need it."

# A scrape job for these rules (Prometheus' own configuration, not part of this file):
#
#   - job_name: tandem
#     scheme: http
#     metrics_path: /metrics
#     authorization: { credentials_file: /etc/prometheus/secrets/tandem-metrics-token }
#     kubernetes_sd_configs: [{ role: pod, namespaces: { names: [tandem] } }]
#     relabel_configs:
#       - { source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], regex: tandem, action: keep }
#       - { source_labels: [__meta_kubernetes_pod_container_port_number], regex: "8080", action: keep }
#       - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
