<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Loading"><title>Loading</title><style>.l,.r{animation:1.5s cubic-bezier(.65,0,.35,1) infinite}.l{animation-name:l}.r{animation-name:r}.g{transform-origin:48px 48px;animation:p 1.5s cubic-bezier(.65,0,.35,1) infinite}@keyframes l{0%,100%{transform:translateX(-3.5px)}42%,58%{transform:translateX(1.75px)}}@keyframes r{0%,100%{transform:translateX(3.5px)}42%,58%{transform:translateX(-1.75px)}}@keyframes p{0%,34%,66%,100%{transform:scale(1)}50%{transform:scale(.94)}}@media (prefers-reduced-motion:reduce){.l,.r,.g{animation:none}}</style><g class="g"><path class="l" fill="#0e3b3b" d="M12 16H46.5V82H39V34H12Z"/><path class="r" fill="#0e3b3b" d="M84 16H49.5V82H57V34H84Z"/></g></svg>
